<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임신 출산 육아</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#4285f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="육아OS" />
</head>
<body>
  <h1>임신 출산 육아</h1>
  <p class="subtitle">주차별/개월수별 정보와 체크리스트</p>

  <div class="card">
    <button id="login-btn">Google로 로그인</button>
    <button id="logout-btn" hidden>로그아웃</button>
    <p id="auth-status">확인 중...</p>
  </div>

  <div class="card" id="household-setup-section" hidden>
    <h2>배우자와 연결하기</h2>
    <p>둘 중 한 명이 먼저 "가구 만들기"를 누르고, 다른 한 명은 그 초대 코드로 "참여하기"를 눌러줘.</p>

    <button id="create-household-btn">가구 만들기</button>

    <div class="join-row">
      <input id="invite-code-input" type="text" placeholder="초대 코드 입력 (예: AB12CD)" maxlength="6" />
      <button id="join-household-btn">참여하기</button>
    </div>
    <p id="household-error" class="error" hidden></p>
  </div>

  <div class="card" id="household-connected-section" hidden>
    <h2>연결 완료</h2>
    <p id="household-status"></p>
    <p id="invite-code-display" class="invite-code"></p>
  </div>

  <div class="card" id="onboarding-section" hidden>
    <h2>기본 정보 입력</h2>

    <div class="radio-row">
      <label><input type="radio" name="due-mode" value="due-date" checked /> 출산 예정일을 알아요</label>
      <label><input type="radio" name="due-mode" value="current-week" /> 예정일은 모르고 현재 주차만 알아요</label>
    </div>

    <div id="due-date-field">
      <label class="field-label" for="due-date-input">출산 예정일</label>
      <input id="due-date-input" type="date" />
    </div>

    <div id="current-week-field" hidden>
      <label class="field-label" for="current-week-input">현재 임신 주차</label>
      <input id="current-week-input" type="number" min="1" max="42" placeholder="예: 8" />
    </div>

    <p class="field-label">해당하는 상황이 있으면 선택해줘 (없으면 그냥 넘어가도 돼)</p>
    <div id="tags-list" class="tags-list"></div>

    <button id="save-onboarding-btn">저장하고 시작하기</button>
    <p id="onboarding-error" class="error" hidden></p>
  </div>

  <div id="app-shell" hidden>

    <main id="view-home" class="view">
      <div class="card" id="week-result-section">
        <h2 id="week-result-title"></h2>
        <p class="baby-info" id="week-baby-info"></p>
      </div>

      <div id="partner-feed" class="partner-feed" hidden></div>

      <div class="role-toggle">
        <button id="role-mom-btn" class="role-btn active">엄마</button>
        <button id="role-dad-btn" class="role-btn">아빠</button>
      </div>

      <div class="card" id="role-card">
        <p id="role-card-text"></p>
      </div>

      <a href="#" id="todo-summary-link" class="card todo-summary-link">
        <span id="todo-summary-text"></span>
        <span class="arrow">→</span>
      </a>

      <p class="disclaimer" id="disclaimer-text"></p>
    </main>

    <main id="view-symptoms" class="view" hidden>
      <h2>증상가이드</h2>
      <p class="subtitle">지금 느끼는 증상을 선택해줘</p>
      <div id="symptom-chips" class="tags-list"></div>
      <div id="symptom-detail"></div>
    </main>

    <main id="view-canido" class="view" hidden>
      <h2>이거 해도 돼?</h2>
      <p class="subtitle">궁금한 걸 검색해봐</p>
      <input id="canido-search" type="text" placeholder="예: 커피, 타이레놀, 비행기" />
      <div id="canido-result"></div>
      <p class="field-label">자주 찾는 검색어</p>
      <div id="canido-chips" class="tags-list"></div>
    </main>

    <main id="view-todos" class="view" hidden>
      <h2>할 일 · 검진</h2>
      <ul id="todo-list" class="checklist-list"></ul>
      <p id="todo-empty" class="muted" hidden>이번 주에 해당하는 항목이 없어요.</p>
    </main>

    <nav id="tab-bar">
      <button class="tab-btn" data-view="home"><span class="tab-icon">🏠</span>홈</button>
      <button class="tab-btn" data-view="symptoms"><span class="tab-icon">🩺</span>증상가이드</button>
      <button class="tab-btn" data-view="canido"><span class="tab-icon">❓</span>이거해도돼</button>
      <button class="tab-btn" data-view="todos"><span class="tab-icon">✅</span>할일·검진</button>
    </nav>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
