<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임신 출산 육아</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>임신 출산 육아</h1>
  <p class="subtitle">주차별/개월수별 정보와 체크리스트</p>

  <div class="card">
    <button id="login-btn">Google로 로그인</button>
    <button id="logout-btn" hidden>로그아웃</button>
    <p id="auth-status">확인 중...</p>
  </div>

  <div class="card" id="household-setup-section" hidden>
    <h2>배우자와 연결하기</h2>
    <p>둘 중 한 명이 먼저 "가구 만들기"를 누르고, 다른 한 명은 그 초대 코드로 "참여하기"를 눌러줘.</p>

    <button id="create-household-btn">가구 만들기</button>

    <div class="join-row">
      <input id="invite-code-input" type="text" placeholder="초대 코드 입력 (예: AB12CD)" maxlength="6" />
      <button id="join-household-btn">참여하기</button>
    </div>
    <p id="household-error" class="error" hidden></p>
  </div>

  <div class="card" id="household-connected-section" hidden>
    <h2>연결 완료</h2>
    <p id="household-status"></p>
    <p id="invite-code-display" class="invite-code"></p>
  </div>

  <div class="card" id="onboarding-section" hidden>
    <h2>기본 정보 입력</h2>

    <div class="radio-row">
      <label><input type="radio" name="due-mode" value="due-date" checked /> 출산 예정일을 알아요</label>
      <label><input type="radio" name="due-mode" value="current-week" /> 예정일은 모르고 현재 주차만 알아요</label>
    </div>

    <div id="due-date-field">
      <label class="field-label" for="due-date-input">출산 예정일</label>
      <input id="due-date-input" type="date" />
    </div>

    <div id="current-week-field" hidden>
      <label class="field-label" for="current-week-input">현재 임신 주차</label>
      <input id="current-week-input" type="number" min="1" max="42" placeholder="예: 8" />
    </div>

    <p class="field-label">해당하는 상황이 있으면 선택해줘 (없으면 그냥 넘어가도 돼)</p>
    <div id="tags-list" class="tags-list"></div>

    <button id="save-onboarding-btn">저장하고 시작하기</button>
    <p id="onboarding-error" class="error" hidden></p>
  </div>

  <div class="card" id="week-result-section" hidden>
    <h2 id="week-result-title"></h2>
    <p class="baby-info" id="week-baby-info"></p>
    <p class="mom-info" id="week-mom-info"></p>
  </div>

  <div class="card" id="checklist-section" hidden>
    <h2>이번 주 체크리스트</h2>
    <ul id="checklist-list" class="checklist-list"></ul>
    <p id="checklist-empty" class="muted" hidden>이번 주에 해당하는 항목이 없어요.</p>
  </div>

  <p class="disclaimer" id="disclaimer-text" hidden></p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
